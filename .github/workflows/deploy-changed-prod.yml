name: Deploy Changed (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-companyplan-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed targets
        id: changes
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          printf '%s\n' "$CHANGED_FILES"

          DEPLOY_WEB=false
          DEPLOY_API=false

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/web/|scripts/deploy-oss\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            DEPLOY_WEB=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/server/|deploy/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            DEPLOY_API=true
          fi

          echo "deploy_web=$DEPLOY_WEB" >> "$GITHUB_OUTPUT"
          echo "deploy_api=$DEPLOY_API" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.deploy_web == 'true'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.deploy_web == 'true'
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changes.outputs.deploy_web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.changes.outputs.deploy_web == 'true'
        run: pnpm build

      - name: Deploy web to OSS
        if: steps.changes.outputs.deploy_web == 'true'
        run: node scripts/deploy-oss.mjs
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: oss-cn-beijing
          OSS_BUCKET: soyoo-ops-web

      - name: Deploy API to server
        if: steps.changes.outputs.deploy_api == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.DEPLOY_USER || secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            cd ${{ secrets.DEPLOY_PATH }}
            GIT_SSH_COMMAND="ssh -i ~/.ssh/soyoo-ops" git pull --ff-only
            ./deploy/deploy.sh
