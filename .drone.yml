kind: pipeline
type: exec
name: deploy

platform:
  os: linux
  arch: amd64

clone:
  disable: true

steps:
  - name: check-target
    commands:
      - |
        case "$DEPLOY_TARGET" in
          api|web)
            echo "DEPLOY_TARGET=$DEPLOY_TARGET"
            ;;
          *)
            echo "Please set DEPLOY_TARGET to api or web"
            exit 1
            ;;
        esac

  - name: deploy-api
    commands:
      - |
        if [ "$DEPLOY_TARGET" != "api" ]; then
          echo "Skip API deploy"
          exit 0
        fi
      - export HOME=/root
      - export NVM_DIR=/root/.nvm
      - if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
      - nvm use 20.20.0
      - export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
      - cd /home/companyPlan
      - GIT_SSH_COMMAND="ssh -i ~/.ssh/soyoo-ops" git pull --ff-only
      - ./deploy/deploy.sh

  - name: deploy-web
    environment:
      OSS_ACCESS_KEY_ID:
        from_secret: oss_access_key_id
      OSS_ACCESS_KEY_SECRET:
        from_secret: oss_access_key_secret
      OSS_REGION: oss-cn-beijing
      OSS_BUCKET: soyoo-ops-web
    commands:
      - |
        if [ "$DEPLOY_TARGET" != "web" ]; then
          echo "Skip Web deploy"
          exit 0
        fi
      - export HOME=/root
      - export NVM_DIR=/root/.nvm
      - if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
      - nvm use 20.20.0
      - export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
      - cd /home/companyPlan
      - GIT_SSH_COMMAND="ssh -i ~/.ssh/soyoo-ops" git pull --ff-only
      - npm config set registry https://registry.npmmirror.com
      - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10.32.1
      - pnpm config set registry https://registry.npmmirror.com
      - pnpm install --frozen-lockfile
      - pnpm run deploy:web

trigger:
  branch:
    - main
  event:
    - custom
