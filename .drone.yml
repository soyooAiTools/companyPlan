kind: pipeline
type: exec
name: deploy-changed

platform:
  os: linux
  arch: amd64

clone:
  disable: true

steps:
  - name: deploy
    environment:
      OSS_ACCESS_KEY_ID:
        from_secret: oss_access_key_id
      OSS_ACCESS_KEY_SECRET:
        from_secret: oss_access_key_secret
      OSS_REGION: oss-cn-beijing
      OSS_BUCKET: soyoo-ops-web
    commands:
      - export HOME=/root
      - export NVM_DIR=/root/.nvm
      - if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
      - nvm use 20.20.0
      - export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
      - cd /home/companyPlan
      - git fetch origin main
      - CHANGED_FILES="$(git diff --name-only HEAD..origin/main)"
      - printf '%s\n' "$CHANGED_FILES"
      - |
        DEPLOY_API=0
        DEPLOY_WEB=0

        if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/server/|deploy/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
          DEPLOY_API=1
        fi

        if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(apps/web/|scripts/deploy-oss\.mjs|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)'; then
          DEPLOY_WEB=1
        fi

        if [ "$DEPLOY_API" = "0" ] && [ "$DEPLOY_WEB" = "0" ]; then
          echo "No API or Web deployment files changed."
          exit 0
        fi

        GIT_SSH_COMMAND="ssh -i ~/.ssh/soyoo-ops" git pull --ff-only
        npm config set registry https://registry.npmmirror.com
        command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10.32.1
        pnpm config set registry https://registry.npmmirror.com

        if [ "$DEPLOY_WEB" = "1" ]; then
          echo "Deploy Web"
          pnpm install --frozen-lockfile
          pnpm run deploy:web
        fi

        if [ "$DEPLOY_API" = "1" ]; then
          echo "Deploy API"
          ./deploy/deploy.sh
        fi

trigger:
  branch:
    - main
  event:
    - push
